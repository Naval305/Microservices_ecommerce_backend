[project]
name = "product-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "ipdb>=0.13.13",
    "monkeytype>=23.3.0",
    "pytest>=9.1.1",
    "righttyper>=0.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
