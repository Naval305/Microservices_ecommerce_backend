[project]
name = "user-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.0.1",
    "cryptography>=50.0.1",
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "flask-migrate>=4.1.0",
    "flask-smorest>=0.47.0",
    "flask-sqlalchemy>=3.1.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pyflakes, pycodestyle, isort, pyupgrade, bugbear