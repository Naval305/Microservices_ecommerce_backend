services:
  web:
    build: .
    ports:
      - "${APP_HOST_PORT}:5000"
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: uv run celery -A celery_worker.celery_app worker --loglevel=INFO
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - web

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  redis_data: